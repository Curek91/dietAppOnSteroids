spring.application.name=trainer-backend
server.port=8080

# Database Configuration (Oracle 23c FREEPDB1)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/freepdb1
spring.datasource.username=diet_app
spring.datasource.password=oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable CORS for frontend running on localhost:4200
# (We will configure this in a WebMvcConfigurer bean in the code as well)
