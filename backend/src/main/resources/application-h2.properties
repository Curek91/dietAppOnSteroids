# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:diet_app;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.username=diet_app
spring.datasource.password=oracle
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console Configuration (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate settings for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
