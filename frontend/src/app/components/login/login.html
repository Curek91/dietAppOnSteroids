<div class="login-container">
  <div class="background-decor decor-1"></div>
  <div class="background-decor decor-2"></div>

  <div class="login-card">
    <div class="brand-section">
      <div class="logo-icon">🔥</div>
      <h1 class="brand-title">DietApp<span>OnSteroids</span></h1>
      <p class="brand-subtitle">Zaloguj się do panelu trenerskiego</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <!-- Error Message -->
      @if (errorMessage()) {
        <div class="error-alert">
          <span class="error-icon">⚠️</span>
          <span class="error-text">{{ errorMessage() }}</span>
        </div>
      }

      <!-- Username Input -->
      <div class="form-group">
        <label for="username">Nazwa użytkownika</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="username" 
            name="username" 
            [(ngModel)]="username" 
            placeholder="Wpisz swój login" 
            required 
            class="login-input"
            autocomplete="username"
          />
        </div>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <label for="password">Hasło</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="password" 
            placeholder="Wpisz hasło" 
            required 
            class="login-input"
            autocomplete="current-password"
          />
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="isLoading()" class="btn-login">
        @if (isLoading()) {
          <span class="spinner"></span> Uwierzytelnianie...
        } @else {
          Zaloguj się 🚀
        }
      </button>
    </form>
  </div>
</div>
