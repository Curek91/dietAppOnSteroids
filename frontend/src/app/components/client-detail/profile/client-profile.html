<div class="glass-card panel-card" *ngIf="client()">
  <h2 class="pane-title">Dane Podopiecznego</h2>
  <div class="profile-form-grid">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Imię</label>
        <input type="text" [(ngModel)]="client().firstName" class="form-input" />
      </div>
      <div class="form-group">
        <label class="form-label">Nazwisko</label>
        <input type="text" [(ngModel)]="client().lastName" class="form-input" />
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input type="email" [(ngModel)]="client().email" class="form-input" />
      </div>
      <div class="form-group">
        <label class="form-label">Telefon</label>
        <input type="text" [(ngModel)]="client().phone" class="form-input" />
      </div>
    </div>
    <div class="form-group" style="max-width: 50%;">
      <label class="form-label">Data urodzenia</label>
      <input type="date" [(ngModel)]="client().birthDate" class="form-input" />
    </div>
    <div class="form-group">
      <label class="form-label">Notatki trenera i cele</label>
      <textarea [(ngModel)]="client().notes" rows="6" class="form-input" placeholder="Wpisz cele podopiecznego, alergie, przeciwwskazania..."></textarea>
    </div>
    <div class="profile-actions">
      <button class="btn btn-primary" (click)="updateClientProfile()">
        Zapisz zmiany profilu
      </button>
    </div>
  </div>
</div>
