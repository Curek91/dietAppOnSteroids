<header class="app-header">
  <div class="logo-container">
    <a routerLink="/" class="back-link">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="back-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
      </svg>
    </a>
    <span>{{ client()?.firstName }} {{ client()?.lastName }}</span>
  </div>
  <div class="header-right-actions" style="display: flex; align-items: center; gap: 15px;">
    <div class="header-status">
      <span class="status-badge active-client-badge">Podopieczny</span>
    </div>
    <div class="header-user-actions" *ngIf="authService.currentUser() as trainer">
      <span class="trainer-name-badge">
        <span class="badge-dot"></span>
        Trener: <strong>{{ trainer.name }}</strong>
      </span>
      <button class="btn-logout-header" (click)="authService.logout()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:16px;height:16px;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
        </svg>
        Wyloguj
      </button>
    </div>
  </div>
</header>

<div class="detail-container animate-fade">
  <!-- Tabs Navigation -->
  <nav class="tabs-nav glass-card">
    <button 
      class="tab-btn" 
      [class.active]="activeTab() === 'profile'" 
      (click)="switchTab('profile')">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="tab-icon"><path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
      Profil
    </button>
    <button 
      class="tab-btn" 
      [class.active]="activeTab() === 'progress'" 
      (click)="switchTab('progress')">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="tab-icon"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 14.25v2.25m3-4.5v4.5m3-6.75v6.75m3-9v9M6 20.25h12A2.25 2.25 0 0020.25 18V6A2.25 2.25 0 0018 3.75H6A2.25 2.25 0 003.75 6v12A2.25 2.25 0 006 20.25z" /></svg>
      Postępy i Wykresy
    </button>
    <button 
      class="tab-btn" 
      [class.active]="activeTab() === 'diet'" 
      (click)="switchTab('diet')">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="tab-icon"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18m9-9H3" /></svg>
      Plan Diety
    </button>
    <button 
      class="tab-btn" 
      [class.active]="activeTab() === 'workout'" 
      (click)="switchTab('workout')">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="tab-icon"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" /></svg>
      Trening
    </button>
  </nav>

  <!-- TAB CONTENTS -->
  
  <!-- 1. PROFILE TAB -->
  <section class="tab-pane animate-fade" *ngIf="activeTab() === 'profile'">
    <app-client-profile 
      *ngIf="client()"
      [client]="client()!" 
      (profileUpdated)="client.set($event)">
    </app-client-profile>
  </section>

  <!-- 2. PROGRESS TAB -->
  <section class="tab-pane animate-fade" *ngIf="activeTab() === 'progress'">
    <app-client-progress 
      [clientId]="clientId()">
    </app-client-progress>
  </section>

  <!-- 3. DIET TAB -->
  <section class="tab-pane animate-fade" *ngIf="activeTab() === 'diet'">
    <app-client-diet 
      [clientId]="clientId()">
    </app-client-diet>
  </section>

  <!-- 4. WORKOUT TAB -->
  <section class="tab-pane animate-fade" *ngIf="activeTab() === 'workout'">
    <app-client-workout 
      [clientId]="clientId()">
    </app-client-workout>
  </section>
</div>
